<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat WebSocket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin: 0;
        }

        .container {
            display: flex;
            min-height: 80vh;
            justify-content: space-between;
        }

        .sidebar {
            background-color: #fff;
            width: 25%;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .sidebar h2 {
            margin-top: 0;
        }

        .chat {
            width: 70%;
            padding: 20px;
        }

        .messages {
            background-color: #fff;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 10px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .message {
            padding: 5px 0;
            margin-bottom: 10px;
        }

        .message .sender {
            font-weight: bold;
        }

        .chat-form {
            display: flex;
            gap: 10px;
        }

        .chat-form input {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .chat-form button {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .sidebar button {
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .sidebar button:hover {
            background-color: #444;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            padding: 5px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Chat WebSocket</h1>
    </header>
    <div class="container">
        <div class="sidebar">
            <div id="loginForm" class="form">
                <h2>Login</h2>
                <form>
                    <input type="text" id="loginUsername" placeholder="Nome de usuário" required>
                    <input type="password" id="loginPassword" placeholder="Senha" required>
                    <button type="submit">Entrar</button>
                </form>
                <button id="showRegister">Não tem uma conta? Registre-se</button>
            </div>

            <div id="registerForm" class="form hidden">
                <h2>Registrar</h2>
                <form>
                    <input type="text" id="regUsername" placeholder="Nome de usuário" required>
                    <input type="password" id="regPassword" placeholder="Senha" required>
                    <button type="submit">Registrar</button>
                </form>
                <button id="showLogin">Já tem uma conta? Faça login</button>
            </div>

            <div id="userSection" class="hidden">
                <h2>Olá, <span id="currentUser"></span></h2>
                <button id="logoutBtn">Logout</button>
                <h2>Solicitar Amizade</h2>
                <form id="friendForm">
                    <input type="text" id="friendUsername" placeholder="Nome do amigo" required>
                    <button type="submit">Enviar Pedido</button>
                </form>
                <h2>Amigos</h2>
                <ul id="friendsList"></ul>
                <input type="hidden" id="selectedFriend">
                <h2>Pedidos Pendentes</h2>
                <ul id="pendingList"></ul>
            </div>
        </div>
        <div class="chat">
            <div class="messages" id="messages"></div>
            <form class="chat-form hidden" id="chatForm">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." required>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        let stompClient;
        let currentUser = localStorage.getItem('chatUser');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const showRegisterBtn = document.getElementById('showRegister');
        const showLoginBtn = document.getElementById('showLogin');
        const userSection = document.getElementById('userSection');
        const chatForm = document.getElementById('chatForm');
        const friendsList = document.getElementById('friendsList');

        function toggleForms() {
            const logged = !!currentUser;
            loginForm.classList.toggle('hidden', logged);
            registerForm.classList.add('hidden');
            userSection.classList.toggle('hidden', !logged);
            chatForm.classList.toggle('hidden', !logged);
            if (logged) document.getElementById('currentUser').textContent = currentUser;
        }

        showRegisterBtn.addEventListener('click', () => {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
        });
        showLoginBtn.addEventListener('click', () => {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
        });

        loginForm.addEventListener('submit', e => {
            e.preventDefault();
            fetch('/api/users/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('loginUsername').value,
                    password: document.getElementById('loginPassword').value
                })
            })
            .then(res => res.ok ? res.json() : Promise.reject('falha login'))
            .then(user => {
                currentUser = user.username;
                localStorage.setItem('chatUser', currentUser);
                toggleForms();
                connectWebSocket();
                loadPending();
                loadFriends();
            })
            .catch(() => alert('Login inválido'));
        });

        registerForm.addEventListener('submit', e => {
            e.preventDefault();
            fetch('/api/users/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('regUsername').value,
                    password: document.getElementById('regPassword').value
                })
            })
            .then(res => res.json())
            .then(user => {
                alert('Registrado com sucesso! Faça login.');
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('chatUser');
            currentUser = null;
            toggleForms();
        });

        document.getElementById('friendForm').addEventListener('submit', e => {
            e.preventDefault();
            fetch('/api/friends/request', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ senderUsername: currentUser, receiverUsername: document.getElementById('friendUsername').value })
            }).then(() => loadPending());
        });

        function loadPending() {
            fetch(`/api/friends/pending/${currentUser}`)
                .then(res => res.json())
                .then(list => {
                    const ul = document.getElementById('pendingList');
                    ul.innerHTML = '';
                    list.forEach(req => {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            ${req.sender.username}
                            <button data-id="${req.id}" class="accept-btn">Aceitar</button>
                        `;
                        ul.appendChild(li);
                    });

                    document.querySelectorAll('.accept-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const id = btn.getAttribute('data-id');
                            fetch(`/api/friends/accept/${id}`, {
                                method: 'POST'
                            })
                            .then(res => {
                                if (res.ok) {
                                    btn.parentElement.innerHTML = `Pedido de ${btn.parentElement.textContent.trim().split('\n')[0]} aceito.`;
                                    loadFriends();
                                } else {
                                    alert('Erro ao aceitar o pedido.');
                                }
                            });
                        });
                    });
                });
        }

        function loadFriends() {
            fetch(`/api/friends/get-all-friends/${currentUser}`)
                .then(res => res.json())
                .then(friends => {
                    friendsList.innerHTML = '';
                    friends.forEach(friend => {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            ${friend.username}
                            <button class="chat-btn" data-user="${friend.username}">Conversar</button>
                        `;
                        friendsList.appendChild(li);
                    });

                    document.querySelectorAll('.chat-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const friendUsername = btn.getAttribute('data-user');
                            document.getElementById('selectedFriend').value = friendUsername;
                            document.getElementById('messages').innerHTML = '';
                            subscribeToChat(friendUsername);
                        });
                    });
                });
        }

        let chatSubscription;
        function subscribeToChat(friendUsername) {
            if (chatSubscription) chatSubscription.unsubscribe();

            const topicPath = `/topic/messages/${currentUser}/${friendUsername}`;
            chatSubscription = stompClient.subscribe(topicPath, (message) => {
                const msg = JSON.parse(message.body);
                displayMessage(msg.sender.username, msg.content);
            });
        }

        function displayMessage(sender, content) {
            const msgDiv = document.getElementById('messages');
            const msgEl = document.createElement('div');
            msgEl.classList.add('message');
            msgEl.innerHTML = `<span class="sender">${sender}:</span> ${content}`;
            msgDiv.appendChild(msgEl);
            msgDiv.scrollTop = msgDiv.scrollHeight;
        }

        document.getElementById('chatForm').addEventListener('submit', e => {
            e.preventDefault();
            const content = document.getElementById('messageInput').value;
            const receiver = document.getElementById('selectedFriend').value;
            if (!receiver || !content) return;

            stompClient.send("/api/messages/sendMessage", {}, JSON.stringify({
                senderUsername: currentUser,
                receiverUsername: receiver,
                content: content
            }));

            displayMessage(currentUser, content); // mostra a própria mensagem também
            document.getElementById('messageInput').value = '';
        });

        function connectWebSocket() {
            const socket = new SockJS('/ws-chat');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, () => {
                stompClient.subscribe(`/topic/friends/${currentUser}`, (message) => {
                    if (message.body === 'updated') {
                        loadFriends();
                    }
                });
            });
        }

        toggleForms();
        if (currentUser) { connectWebSocket(); loadPending(); loadFriends(); }
    </script>
</body>
</html>
